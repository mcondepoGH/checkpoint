name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"   # semanal: reejecuta los tests con las dependencias del momento

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -n 0 --cov=app --cov-fail-under=90

  backend-windows:
    # Motor de sincronización en Windows (bloqueo de juego con msvcrt, «Este equipo», detección con tasklist).
    # Solo las pruebas del motor: sin ruff ni umbral de cobertura (ya los pasa el job backend en Linux).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: >-
          pytest -n 0 -rfE --tb=short
          tests/test_locking.py tests/test_local_transport.py tests/test_local_e2e.py
          tests/test_local_api.py tests/test_local_config.py
          tests/test_sync.py tests/test_sync_codes.py tests/test_sync_one_device.py
          tests/test_conflicts.py tests/test_orphans.py tests/test_fingerprint_manifest.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage   # node --test + umbral de cobertura (líneas 90, ramas 88)
      - run: npm run build
      - run: npm run check:size      # presupuesto de tamaño del bundle

  client:
    # Cliente de Linux (checkpoint-client/). Lleva dentro checkpoint-core (package-dir), así que `-e` instala los dos.
    # Las pruebas de integración con el hub real se omiten solas (el job no instala las dependencias del backend).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkpoint-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            checkpoint-client/pyproject.toml
            checkpoint-core/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  core:
    # Código común al plugin de la Deck y al cliente (checkpoint-core/). El plugin corre en el Python de Decky:
    # el core debe seguir siendo compatible con 3.8 (por eso 3.8 va en la matriz) y con el Python del cliente (3.12).
    # 3.8 va en ubuntu-22.04 porque setup-python ya no ofrece 3.8 en ubuntu-24.04 ni 26.04 (ubuntu-latest).
    # Cuando GitHub retire la imagen ubuntu-22.04 habrá que subir el mínimo del core o buscar otra vía.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    defaults:
      run:
        working-directory: checkpoint-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: checkpoint-core/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
