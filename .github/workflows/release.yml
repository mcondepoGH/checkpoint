name: Release

# Publica la imagen en GHCR y crea la GitHub Release al subir un tag vX.Y.Z[-sufijo].
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # crear la Release
  packages: write   # publicar en ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.v.outputs.image }}:v${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar que VERSION coincide con el tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$file" != "$version" ]; then
            echo "::error::VERSION ($file) no coincide con el tag $TAG (esperado $version). Actualiza VERSION, haz commit y vuelve a crear el tag."
            exit 1
          fi
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<<"$version"; then
            echo "::error::El tag $TAG no tiene formato vX.Y.Z[-sufijo]."
            exit 1
          fi
          # Con sufijo (-rc.1, -beta.2...) es pre-release.
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$pre"
            echo "image=ghcr.io/${OWNER,,}/checkpoint"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=v${{ steps.v.outputs.version }}
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ steps.v.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.v.outputs.prerelease == 'true' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Baja siempre la base actual: evita reutilizar una capa de python:3.12-alpine obsoleta (y con CVE ya corregidos).
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo amd64. Para arm64 añade `docker/setup-qemu-action@v3` antes de buildx
          # y usa: platforms: linux/amd64,linux/arm64 (el build bajo QEMU es lento).
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crear la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}"

  # Escaneo informativo de la imagen ya publicada: no bloquea (exit-code 0) y deja el informe como
  # artefacto `trivy-report`, que security-issues convierte en issues con plazo. Si el escaneo falla,
  # la Release ya está creada (este job va después de `release`).
  trivy:
    needs: release
    permissions:
      contents: read
      packages: read   # la imagen de GHCR puede ser privada
    uses: ./.github/workflows/trivy-release.yml
    with:
      scan-type: image
      scan-ref: ${{ needs.release.outputs.image-ref }}
      ignore-unfixed: true   # los CVE sin corrección no abren issues

  # Wheel del cliente de Linux (checkpoint-client/), adjunto a la Release que acaba de crear `release`.
  # La versión del cliente es la de su pyproject.toml (propia, independiente del tag del hub): el wheel se llama
  # checkpoint_client-<versión del cliente>-*.whl, y `checkpoint-client check-update` la lee del nombre del asset.
  # Una pre-release (-rc) también lleva el wheel, pero check-update solo mira la última Release ESTABLE. Solo se
  # sube el wheel (nunca un sdist: package-dir apunta a ../checkpoint-core, fuera de la carpeta del cliente).
  client:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # subir el asset a la Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Comprobar que existe la Release del tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,isPrerelease --jq '"Release \(.tagName) (pre-release: \(.isPrerelease))"'

      - name: Construir el wheel
        working-directory: checkpoint-client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "build==1.6.1"
          python -m build --wheel
          ls -l dist

      - name: Verificar el contenido del wheel
        working-directory: checkpoint-client
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"::error::Se esperaba un solo wheel en dist/ y hay {len(wheels)}: {wheels}")
          names = zipfile.ZipFile(wheels[0]).namelist()
          for pkg in ("checkpoint_client/", "checkpoint_core/"):
              if not any(n.startswith(pkg) for n in names):
                  sys.exit(f"::error::El wheel no contiene {pkg}")
          bad = [n for n in names if n.rsplit("/", 1)[-1] == "secrets.py"]
          if bad:
              sys.exit(f"::error::El wheel contiene ficheros prohibidos: {bad}")
          print(f"{wheels[0]}: {len(names)} ficheros, con checkpoint_client/ y checkpoint_core/ y sin secrets.py")
          PY

      - name: Subir el wheel a la Release
        working-directory: checkpoint-client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.whl --clobber

  # Instalador .exe del hub para Windows (packaging/windows), adjunto a la Release que acaba de crear `release`, con su
  # hash (<nombre>.exe.sha256) para la actualización con un clic. Sin firma de código (SmartScreen avisará).
  # Verifica que VERSION coincide con el tag, construye, pasa el smoke test (instalación silenciosa y consulta al
  # puerto 8088) y solo entonces sube. Las pre-releases (-rc) también llevan instalador; no cambia su marca de latest,
  # que fija el job `release`.
  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write   # subir los assets a la Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Construir el instalador (comprueba VERSION contra el tag)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./packaging/windows/build.ps1 -Tag $env:TAG

      - name: Smoke test (instalar en silencio, consultar 8088, desinstalar)
        shell: pwsh
        run: ./packaging/windows/smoke.ps1

      - name: Subir el instalador y su hash a la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "Checkpoint-Setup-$version.exe"
          gh release view $env:TAG --json tagName | Out-Null
          gh release upload $env:TAG "packaging/windows/Output/$name" "packaging/windows/Output/$name.sha256" --clobber

  # Paquete nativo de Linux (packaging/linux), adjunto a la Release que acaba de crear `release`: el tarball
  # checkpoint-<versión>-linux.tar.gz y su hash (<nombre>.sha256) para la actualización con un clic. Verifica que VERSION
  # coincide con el tag, construye (con el plugin de Deck), pasa el smoke test (install.sh --no-login --no-start y arranque
  # del hub) y solo entonces sube. Las pre-releases (-rc) también lo llevan. Ningún job depende de este: si falla, la
  # Release sigue publicada y se puede reintentar (`gh release upload --clobber`). Como el .exe, los assets llegan DESPUÉS
  # de publicarse la Release: en esa ventana un hub que consulte la Release no ve instalador.
  linux:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # subir los assets a la Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Comprobar que VERSION coincide con el tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$file" != "$version" ]; then
            echo "::error::VERSION ($file) no coincide con el tag $TAG (esperado $version). Actualiza VERSION, haz commit y vuelve a crear el tag."
            exit 1
          fi
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<<"$version"; then
            echo "::error::El tag $TAG no tiene formato vX.Y.Z[-sufijo]."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Construir el tarball (con el plugin de Deck)
        env:
          TAG: ${{ github.ref_name }}
        run: bash packaging/linux/build.sh --tag "$TAG"

      - name: Smoke test (instalar con install.sh y arrancar el hub)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash packaging/linux/smoke.sh "dist/checkpoint-$VERSION-linux.tar.gz"

      - name: Subir el tarball y su hash a la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName > /dev/null
          gh release upload "$TAG" "dist/checkpoint-$VERSION-linux.tar.gz" "dist/checkpoint-$VERSION-linux.tar.gz.sha256" --clobber
